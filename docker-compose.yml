services:
  app:
    build: .
    container_name: finanzas-app
    ports:
      - "5173:5173"
    # Las variables (SUPABASE_*, VITE_SUPABASE_*) se leen del .env local;
    # no se copian dentro de la imagen.
    env_file:
      - .env
    environment:
      # Necesario para que el hot reload funcione con volúmenes en Windows
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Evita que el node_modules del host pise el del contenedor
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
